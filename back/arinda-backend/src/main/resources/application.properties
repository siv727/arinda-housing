spring.application.name=arindahousing

# DB connection (uses Aiven in production)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/dbarinda}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

# SSL for cloud databases like Aiven (optional for local dev)
spring.datasource.hikari.data-source-properties.useSSL=true
spring.datasource.hikari.data-source-properties.requireSSL=false

# JPA settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
# Let Hibernate auto-detect dialect (MySQL8Dialect is deprecated in Hibernate 6)

# JWT SECRET KEY (externalized for production)
application.security.jwt.secret-key=${JWT_SECRET:dev-fallback-secret-key-change-in-production}
application.security.jwt.expiration=86400000

# Logging (reduced for production)
logging.level.org.springframework.web=INFO

# Cloudinary URL for image storage
CLOUDINARY_URL=${CLOUDINARY_URL:}

# CORS allowed origins (externalized for production)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Increase limits for real estate photos (default is 1MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB